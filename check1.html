        function downloadMembersExcel() {
            const data = state.branchData[state.selectedBranch];
            const branch = state.branches.find(b => b.id === state.selectedBranch);
            
            if (data.members.length === 0) {
                showAlert('다운로드할 회원 데이터가 없습니다.', 'error');
                return;
            }
            
            const excelData = data.members.map(m => ({
                '회원번호': m.memberNumber,
                '성명': m.name,
                '성별': m.gender || '-',
                '생년월일': m.birthDate,
                '연락처': m.phone,
                '거주지역': m.region || '-',
                '가입일': new Date(m.registeredAt).toLocaleDateString('ko-KR'),
                '상태': m.status === 'active' ? '활동' : '비활동'
            }));

            const ws = XLSX.utils.json_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '회원목록');
            
            const dateStr = new Date().toISOString().split('T')[0].replace(/-/g, '');
            const filename = `${dateStr}_${branch.name}_회원목록.xlsx`;
            
            XLSX.writeFile(wb, filename);
            showAlert(`회원 목록이 다운로드되었습니다.`);
        }

        function triggerMemberExcelImport() {
            document.getElementById('memberExcelInput').click();
        }

        function handleMemberExcelImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (!file.name.match(/\.(xlsx|xls)$/)) {
                showAlert('엑셀 파일(.xlsx, .xls)만 선택할 수 있습니다.', 'error');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                    
                    if (jsonData.length === 0) {
                        showAlert('엑셀 파일에 데이터가 없습니다.', 'error');
                        return;
                    }
                    
                    importMembersFromExcel(jsonData);
                } catch (error) {
                    showAlert('엑셀 파일을 읽을 수 없습니다.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }

        function importMembersFromExcel(jsonData) {
            const branchData = state.branchData[state.selectedBranch];
            let successCount = 0;
            let skipCount = 0;
            const errors = [];
            
            jsonData.forEach((row, index) => {
                try {
                    const name = row['성명']?.toString().trim();
                    const birthDate = row['생년월일']?.toString().trim();
                    const gender = row['성별']?.toString().trim();
                    const phone = row['연락처']?.toString().trim();
                    const region = row['거주지역']?.toString().trim();
                    
                    if (!name || !birthDate || !phone) {
                        errors.push(`${index + 2}행: 필수 정보 누락`);
                        skipCount++;
                        return;
                    }
                    
                    let normalizedBirthDate = birthDate;
                    if (birthDate.match(/^\d{8}$/)) {
                        normalizedBirthDate = `${birthDate.substring(0,4)}-${birthDate.substring(4,6)}-${birthDate.substring(6,8)}`;
                    } else if (!birthDate.match(/^\d{4}-\d{2}-\d{2}$/)) {
                        errors.push(`${index + 2}행: 생년월일 형식 오류`);
                        skipCount++;
                        return;
                    }
                    
                    if (branchData.members.find(m => m.phone === phone)) {
                        errors.push(`${index + 2}행: 중복 연락처`);
                        skipCount++;
                        return;
                    }
                    
                    const memberNumber = generateMemberNumber(normalizedBirthDate);
                    
                    branchData.members.push({
                        id: 'M' + Date.now() + '_' + index,
                        memberNumber,
                        name,
                        birthDate: normalizedBirthDate,
                        gender: gender || '남',
                        phone,
                        region: region || '기타',
                        registeredAt: new Date().toISOString(),
                        status: 'active'
                    });
                    
                    successCount++;
                } catch (error) {
                    skipCount++;
                }
            });
            
            if (successCount > 0) {
                triggerAutoSave();
                showAlert(`${successCount}명 등록${skipCount > 0 ? `, ${skipCount}명 건너뜀` : ''}`);
            }
            
            if (errors.length > 0 && errors.length <= 10) {
                alert('일부 데이터 등록 실패:\n\n' + errors.slice(0, 5).join('\n'));
            }
            
            renderMember();
        }

                        • NAS 서버 백업: 온라인 상태에서만 작동하며, 오프라인 시 자동 대기 후 온라인 전환 시 동기화<br>
                        • LocalStorage는 항상 자동 저장됩니다<br>
                        • 멀티 시설 동기화: 각 지점의 데이터를 독립적으로 NAS에 저장하여 데이터 충돌 방지
                    </div>

                    <div style="margin-top: 16px; padding: 16px; background: #f0fdf4; border: 2px solid #86efac; border-radius: 8px; font-size: 12px; color: #166534;">
                        <strong>📘 시놀로지 NAS 연결 가이드</strong><br><br>

                        <strong>1단계: WebDAV 활성화</strong><br>
                        • DSM(DiskStation Manager)에 로그인<br>
                        • 제어판 → 파일 서비스 → WebDAV 탭<br>
                        • "WebDAV 활성화" 체크<br>
                        • HTTP 포트: 5005 (기본값) 또는 원하는 포트<br>
                        • "적용" 클릭<br><br>

                        <strong>2단계: 공유 폴더 생성</strong><br>
                        • 제어판 → 공유 폴더<br>
                        • "생성" 클릭<br>
                        • 이름: facility-backup (또는 원하는 이름)<br>
                        • 생성 완료<br><br>

                        <strong>3단계: 사용자 권한 설정</strong><br>
                        • 공유 폴더 선택 → 편집 → 권한 탭<br>
                        • 사용자에게 "읽기/쓰기" 권한 부여<br>
                        • "확인" 클릭<br><br>

                        <strong>4단계: 시스템에 설정 입력</strong><br>
                        • NAS WebDAV URL: http://NAS_IP:5005/webdav/facility-backup/<br>
                        &nbsp;&nbsp;예: http://192.168.0.100:5005/webdav/facility-backup/<br>
                        • NAS 사용자명: DSM 계정 사용자명<br>
                        • NAS 비밀번호: DSM 계정 비밀번호<br>
                        • "NAS 설정 저장" 클릭<br>
                        • "연결 테스트"로 연결 확인<br><br>

                        <strong>5단계: 방화벽 설정 (필요시)</strong><br>
                        • DSM 제어판 → 보안 → 방화벽<br>
                        • WebDAV 포트(5005) 허용 규칙 추가<br><br>

                        <strong>💡 동작 원리:</strong><br>
                        • 각 시설은 독립적인 데이터 파일(BR-001_시설명_날짜.json)로 저장됩니다<br>
                        • 데이터 변경 시에만 NAS에 업로드하여 효율성 향상<br>
                        • 각 지점의 데이터를 분리하여 충돌 없이 동시 사용 가능<br>
                        • 자동 동기화 활성화 시 설정한 간격마다 자동으로 백업됩니다<br><br>

                        <strong>⚠️ 주의사항:</strong><br>
                        • NAS와 동일한 네트워크에 연결되어 있어야 합니다<br>
                        • 외부에서 접속 시 HTTPS 및 포트 포워딩 설정 필요<br>
                        • 보안을 위해 강력한 비밀번호 사용을 권장합니다
                    </div>
                </div>

                <div class="backup-section">
                    <h3 class="panel-title"><span>💾</span> 수동 백업 및 복원</h3>
                    <div class="backup-info">

        // 새 음료 추가
        function addNewBeverage() {
            const name = document.getElementById('newBeverageName').value.trim();
            const description = document.getElementById('newBeverageDescription').value.trim();
            const ingredients = document.getElementById('newBeverageIngredients').value.trim();
            const recipe = document.getElementById('newBeverageRecipe').value.trim();

            if (!name || !description || !ingredients || !recipe) {
                showAlert('모든 필드를 입력해주세요.', 'error');
                return;
            }

            const data = state.branchData[state.selectedBranch];
            const newBeverage = {
                id: 'BEV-' + Date.now(),
                name,
                description,
                ingredients,
                recipe
            };

            data.beverages.push(newBeverage);
            saveData();
            showAlert('음료가 추가되었습니다.', 'success');
            renderSettings();
        }

        // 음료 수정 토글
        function toggleEditBeverage(beverageId) {
            const viewEl = document.getElementById(`bev-view-${beverageId}`);
            const editEl = document.getElementById(`bev-edit-${beverageId}`);

            viewEl.classList.toggle('hidden');
            editEl.classList.toggle('hidden');
        }

        // 음료 수정 저장
        function saveBeverageEdit(beverageId) {
            const data = state.branchData[state.selectedBranch];
            const beverage = data.beverages.find(b => b.id === beverageId);

            if (!beverage) return;

            const name = document.getElementById(`editBevName-${beverageId}`).value.trim();
            const description = document.getElementById(`editBevDescription-${beverageId}`).value.trim();
            const ingredients = document.getElementById(`editBevIngredients-${beverageId}`).value.trim();
            const recipe = document.getElementById(`editBevRecipe-${beverageId}`).value.trim();

            if (!name || !description || !ingredients || !recipe) {
                showAlert('모든 필드를 입력해주세요.', 'error');
                return;
            }

            beverage.name = name;
            beverage.description = description;
            beverage.ingredients = ingredients;
            beverage.recipe = recipe;

            saveData();
            showAlert('음료 정보가 수정되었습니다.', 'success');
            renderSettings();
        }

        // 음료 삭제
        function deleteBeverage(beverageId) {
            const data = state.branchData[state.selectedBranch];
            const beverage = data.beverages.find(b => b.id === beverageId);

            if (!beverage) return;

            // 주문 내역이 있는지 확인
            const hasOrders = data.beverageOrders.some(order => order.beverageId === beverageId);

            let confirmMsg = `"${beverage.name}"을(를) 삭제하시겠습니까?`;
            if (hasOrders) {
                confirmMsg += '\n\n주문 내역이 있지만 삭제하면 통계에서 제외됩니다.';
            }

            if (!confirm(confirmMsg)) return;

            const index = data.beverages.findIndex(b => b.id === beverageId);
            if (index > -1) {
                data.beverages.splice(index, 1);
                saveData();
                showAlert('음료가 삭제되었습니다.', 'success');
                renderSettings();
            }
        }

        function toggleLocalBackup() {
            state.backupConfig.localEnabled = document.getElementById('localBackupToggle').checked;
            saveBackupConfig();
            showAlert(`로컬 백업이 ${state.backupConfig.localEnabled ? '활성화' : '비활성화'}되었습니다.`);

        function toggleServerBackup() {

        // NAS 연결 테스트
        async function testNASConnection() {
            const nasUrl = document.getElementById('nasUrl').value.trim();
            const nasUsername = document.getElementById('nasUsername').value.trim();
            const nasPassword = document.getElementById('nasPassword').value;

            if (!nasUrl || !nasUsername || !nasPassword) {
                showAlert('NAS 설정을 모두 입력해주세요.', 'error');
                return;
            }

            try {
                const auth = btoa(`${nasUsername}:${nasPassword}`);
                const response = await fetch(nasUrl, {
                    method: 'OPTIONS',
                    headers: {
                        'Authorization': `Basic ${auth}`
                    }
                });

                if (response.ok || response.status === 200 || response.status === 204) {
                    showAlert('✅ NAS 연결 성공! WebDAV 서버에 접근할 수 있습니다.', 'success');
                } else if (response.status === 401) {
                    showAlert('❌ 인증 실패: 사용자명 또는 비밀번호를 확인해주세요.', 'error');
                } else {
                    showAlert(`❌ 연결 실패: HTTP ${response.status}`, 'error');
                }
            } catch (error) {
                console.error('NAS 연결 테스트 오류:', error);
                showAlert('❌ NAS 연결 실패: 네트워크 또는 URL을 확인해주세요.', 'error');
            }
        }

        function renderBeverageStatistics() {
            const data = state.branchData[state.selectedBranch];
            // 완료된 주문만 통계에 포함
            const allOrders = (data.beverageOrders || []).filter(o => o.status === 'completed');

            // 전체 음료 이용 건수
            const totalOrders = allOrders.length;

            // 음료별 주문 횟수
            const beverageCounts = {};
            data.beverages.forEach(bev => {
                beverageCounts[bev.name] = allOrders.filter(o => o.beverageId === bev.id).length;
            });

            // 연령별 선호 음료 (청소년 기준: 10대, 20대 초반)
            const agePreferences = {
                '10-13세': {},
                '14-16세': {},
                '17-19세': {},
                '20세 이상': {}
            };

            allOrders.forEach(order => {
                const member = data.members.find(m => m.id === order.memberId);
                if (!member) return;

                const birthYear = parseInt(member.birthDate.split('-')[0]);
                const currentYear = new Date().getFullYear();
                const age = currentYear - birthYear;

                let ageGroup;
                if (age >= 10 && age <= 13) ageGroup = '10-13세';
                else if (age >= 14 && age <= 16) ageGroup = '14-16세';
                else if (age >= 17 && age <= 19) ageGroup = '17-19세';
                else ageGroup = '20세 이상';

                if (!agePreferences[ageGroup][order.beverageName]) {
                    agePreferences[ageGroup][order.beverageName] = 0;
                }
                agePreferences[ageGroup][order.beverageName]++;
            });

            // 지역별 선호 음료
            const regionPreferences = {};
            state.regions.forEach(region => {
                regionPreferences[region] = {};
            });

            allOrders.forEach(order => {
                const member = data.members.find(m => m.id === order.memberId);
                if (!member) return;

                const region = member.region || '기타';
                if (!regionPreferences[region]) regionPreferences[region] = {};

                if (!regionPreferences[region][order.beverageName]) {
                    regionPreferences[region][order.beverageName] = 0;
                }
                regionPreferences[region][order.beverageName]++;
            });

        // 음료별 선호도 차트
        function updateBeveragePreferenceChart() {
            const data = state.branchData[state.selectedBranch];
            // 완료된 주문만 통계에 포함
            const allOrders = (data.beverageOrders || []).filter(o => o.status === 'completed');
            const canvas = document.getElementById('beveragePreferenceChart');
            if (!canvas) return;

            const beverageCounts = {};
            data.beverages.forEach(bev => {
                beverageCounts[bev.name] = allOrders.filter(o => o.beverageId === bev.id).length;
            });

            const sorted = Object.entries(beverageCounts).sort((a, b) => b[1] - a[1]);
            const labels = sorted.map(item => item[0]);
            const values = sorted.map(item => item[1]);

            if (currentChartInstances['beveragePreference']) {
                currentChartInstances['beveragePreference'].destroy();
            }

            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(139, 92, 246, 0.9)');
            gradient.addColorStop(0.5, 'rgba(139, 92, 246, 0.7)');
            gradient.addColorStop(1, 'rgba(139, 92, 246, 0.4)');

            currentChartInstances['beveragePreference'] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{

        // 연령별 선호 음료 차트
        function updateAgePreferenceChart() {
            const data = state.branchData[state.selectedBranch];
            // 완료된 주문만 통계에 포함
            const allOrders = (data.beverageOrders || []).filter(o => o.status === 'completed');
            const canvas = document.getElementById('agePreferenceChart');
            if (!canvas) return;

            const ageGroups = ['10-13세', '14-16세', '17-19세', '20세 이상'];
            const beverageNames = [...new Set(allOrders.map(o => o.beverageName))];

            const datasets = beverageNames.map((bevName, idx) => {
                const colors = [
                    'rgba(59, 130, 246, 0.8)',
                    'rgba(139, 92, 246, 0.8)',
                    'rgba(16, 185, 129, 0.8)',
                    'rgba(245, 158, 11, 0.8)',
                    'rgba(239, 68, 68, 0.8)'
                ];

                const dataPoints = ageGroups.map(ageGroup => {
                    return allOrders.filter(order => {
                        const member = data.members.find(m => m.id === order.memberId);
                        if (!member) return false;

                        const birthYear = parseInt(member.birthDate.split('-')[0]);
                        const currentYear = new Date().getFullYear();
                        const age = currentYear - birthYear;

                        let group;
                        if (age >= 10 && age <= 13) group = '10-13세';
                        else if (age >= 14 && age <= 16) group = '14-16세';
                        else if (age >= 17 && age <= 19) group = '17-19세';
                        else group = '20세 이상';

                        return group === ageGroup && order.beverageName === bevName;
                    }).length;
                });

                return {
                    label: bevName,
                    data: dataPoints,
                    backgroundColor: colors[idx % colors.length],
                    borderColor: colors[idx % colors.length].replace('0.8', '1'),
                    borderWidth: 2,
                    borderRadius: 6
                };
            });

            if (currentChartInstances['agePreference']) {
                currentChartInstances['agePreference'].destroy();
            }

            const ctx = canvas.getContext('2d');
            currentChartInstances['agePreference'] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ageGroups,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true, position: 'top' },
                        tooltip: {
                            callbacks: {
                                label: (context) => `${context.dataset.label}: ${context.parsed.y}잔`
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1,
                                callback: (value) => value + '잔'
                            }
                        },
                        x: {
                            stacked: false
                        }
                    }
                }
            });
        }

        // 음료 통계 엑셀 다운로드
        function downloadBeverageStatisticsExcel() {
            const data = state.branchData[state.selectedBranch];
            // 완료된 주문만 통계에 포함
            const allOrders = (data.beverageOrders || []).filter(o => o.status === 'completed');

            const rows = [
                ['음료 통계', '', '', ''],
                ['음료명', '총 주문 수', '오늘 주문 수', ''],
                ...data.beverages.map(bev => {
                    const totalOrders = allOrders.filter(o => o.beverageId === bev.id).length;
                    const todayOrders = allOrders.filter(o =>
                        o.beverageId === bev.id &&
                        new Date(o.orderTime).toDateString() === new Date().toDateString()
                    ).length;
                    return [bev.name, totalOrders, todayOrders, ''];
                }),
                ['', '', '', ''],
                ['주문 내역 (완료된 주문)', '', '', ''],
                ['주문 시간', '음료명', '주문자', '회원번호'],
                ...allOrders.map(order => [
                    new Date(order.orderTime).toLocaleString('ko-KR'),
                    order.beverageName,
                    order.memberName,
                    order.memberNumber
                ])
            ];

            const csv = rows.map(row => row.join(',')).join('\n');
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `음료통계_${new Date().toLocaleDateString('ko-KR')}.csv`;
            link.click();
            showAlert('음료 통계가 다운로드되었습니다.', 'success');
        }

        function getFilteredMembers() {
            const data = state.branchData[state.selectedBranch];
            const startYear = document.getElementById('birthYearStart')?.value;
            const endYear = document.getElementById('birthYearEnd')?.value;
            
            let filtered = [...data.members];
            
            if (startYear || endYear) {
                filtered = filtered.filter(m => {
                    const birthYear = parseInt(m.birthDate.split('-')[0]);
                    if (startYear && birthYear < parseInt(startYear)) return false;
                    if (endYear && birthYear > parseInt(endYear)) return false;
                    return true;
                });
            }
            
            return filtered;
        }

        function applyBirthYearFilter() {
            const startYear = document.getElementById('birthYearStart').value;
            const endYear = document.getElementById('birthYearEnd').value;
            const filtered = getFilteredMembers();
            const data = state.branchData[state.selectedBranch];
            
            let filterText = '';
            if (startYear && endYear) {
                filterText = `📌 ${startYear}년 ~ ${endYear}년생 필터 (${filtered.length}명 / 전체 ${data.members.length}명)`;
            } else if (startYear) {
                filterText = `📌 ${startYear}년생 이후 필터 (${filtered.length}명 / 전체 ${data.members.length}명)`;
            } else if (endYear) {
                filterText = `📌 ${endYear}년생 이전 필터 (${filtered.length}명 / 전체 ${data.members.length}명)`;
            }
            
            document.getElementById('filterInfo').textContent = filterText;
            updateAllCharts();
        }

                        legend: {
                            display: chartType === 'pie',
                            position: 'right',
                            labels: {
                                padding: 15,
                                font: { size: 13, weight: '600' },
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            padding: 12,
                            titleFont: { size: 14, weight: 'bold' },
                            bodyFont: { size: 13 },
                            cornerRadius: 8
                        }
                    },
                    scales: chartType !== 'pie' ? {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1,
                                font: { size: 12, weight: '600' },
                                color: '#6b7280'
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.06)',
                                drawBorder: false,
                                lineWidth: 1
                            }
                        },
                        x: {
                            ticks: {
                                font: { size: 11, weight: '500' },
                                color: '#6b7280'
                            },
                            grid: { display: false }
                        }
                    } : {}
                }
            });
        }

        function updateRegionChart() {
            const filtered = getFilteredMembers();
            
            const regionCounts = {};
            filtered.forEach(m => {
                const region = m.region || '기타';
                regionCounts[region] = (regionCounts[region] || 0) + 1;
            });
            
            const sortedRegions = Object.entries(regionCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);
            
            const chartType = document.querySelector('input[name="regionChartType"]:checked')?.value || 'bar';
            const canvas = document.getElementById('regionChart');
            if (!canvas) return;
            
            destroyChart('regionChart');
            
            const ctx = canvas.getContext('2d');
            let bgColor = 'rgba(16, 185, 129, 0.7)';
            if (chartType === 'bar') {
                const gradient = ctx.createLinearGradient(0, 0, 0, 300);
                gradient.addColorStop(0, 'rgba(16, 185, 129, 0.9)');
                gradient.addColorStop(0.5, 'rgba(16, 185, 129, 0.7)');
                gradient.addColorStop(1, 'rgba(16, 185, 129, 0.4)');
                bgColor = gradient;
            } else if (chartType === 'line') {
                const gradient = ctx.createLinearGradient(0, 0, 0, 300);
                gradient.addColorStop(0, 'rgba(16, 185, 129, 0.3)');
                gradient.addColorStop(1, 'rgba(16, 185, 129, 0.05)');
                bgColor = gradient;
            }
            currentChartInstances['regionChart'] = new Chart(ctx, {
                type: chartType,
                data: {
                    labels: sortedRegions.map(r => r[0]),
                    datasets: [{
                        label: '회원 수',
                        data: sortedRegions.map(r => r[1]),
                        backgroundColor: bgColor,
                        borderColor: 'rgba(16, 185, 129, 1)',
                        borderWidth: chartType === 'line' ? 3 : 2,
                        borderRadius: chartType === 'bar' ? 8 : 0,
                        barPercentage: chartType === 'bar' ? 0.5 : undefined,
                        categoryPercentage: chartType === 'bar' ? 0.8 : undefined,
                        fill: chartType === 'line' ? true : true,
                        tension: chartType === 'line' ? 0.4 : 0,
                        pointRadius: chartType === 'line' ? 5 : 0,
                        pointHoverRadius: chartType === 'line' ? 7 : 0,
                        pointBackgroundColor: 'rgba(16, 185, 129, 1)',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        hoverOffset: chartType === 'pie' ? 15 : 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: chartType === 'pie' ? 1500 : 1200,
                        easing: 'easeInOutQuart',
                        delay: chartType !== 'pie' ? (context) => context.dataIndex * 50 : 0
                    },
                    plugins: {
                        legend: {
                            display: chartType === 'pie',
                            position: 'right',
                            labels: {
                                padding: 18,
                                font: { size: 13, weight: '600' },
                                usePointStyle: true,
                                color: '#374151'
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.85)',
                            padding: 14,
                            titleFont: { size: 15, weight: 'bold' },
                            bodyFont: { size: 14 },
                            cornerRadius: 10,
                            displayColors: true,
                            borderWidth: 2
                        }
                    },
                    scales: chartType !== 'pie' ? {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1,
                                font: { size: 12, weight: '600' },
                                color: '#6b7280'
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.06)',
                                drawBorder: false,
                                lineWidth: 1
                            }
                        },
                        x: {
                            ticks: {
                                font: { size: 11, weight: '500' },
                                color: '#6b7280'
                            },
                            grid: { display: false }
                        }
                    } : {}
                }
            });
        }

        function downloadAllStatisticsExcel() {
            const data = state.branchData[state.selectedBranch];
            const branch = state.branches.find(b => b.id === state.selectedBranch);
            const filtered = getFilteredMembers();
            
            const wb = XLSX.utils.book_new();
            
            // 전체 연령별 통계
            const ageGroups = {};
            filtered.forEach(m => {
                const birthYear = m.birthDate.split('-')[0];
                ageGroups[birthYear] = (ageGroups[birthYear] || 0) + 1;
            });
            const ageStats = Object.keys(ageGroups).sort().map(year => ({
                '출생년도': year + '년',
                '회원 수': ageGroups[year]
            }));
            const ws1 = XLSX.utils.json_to_sheet(ageStats);
            XLSX.utils.book_append_sheet(wb, ws1, '전체-연령별');
            
            // 전체 성별 통계
            const genderStats = [
                { '성별': '남성', '회원 수': filtered.filter(m => m.gender === '남').length },
                { '성별': '여성', '회원 수': filtered.filter(m => m.gender === '여').length }
            ];
            const ws2 = XLSX.utils.json_to_sheet(genderStats);
            XLSX.utils.book_append_sheet(wb, ws2, '전체-성별');
            
            // 전체 지역별 통계
            const regionCounts = {};
            filtered.forEach(m => {
                const region = m.region || '기타';
                regionCounts[region] = (regionCounts[region] || 0) + 1;
            });
            const regionStats = Object.entries(regionCounts)
                .sort((a, b) => b[1] - a[1])
                .map(([region, count]) => ({ '지역': region, '회원 수': count }));
            const ws3 = XLSX.utils.json_to_sheet(regionStats);
            XLSX.utils.book_append_sheet(wb, ws3, '전체-지역별');
            
            // 시설별 세부 통계
            const filteredIds = new Set(filtered.map(m => m.id));
            data.facilities.forEach((facility, index) => {
                const facilityReservations = data.reservations.filter(r => 
                    r.facilityId === facility.id && 
                    r.status === 'completed' && 
                    filteredIds.has(r.memberId)
                );
                
                // 시설별 연령 통계
                const facilityAgeGroups = {};
                facilityReservations.forEach(r => {
                    const member = data.members.find(m => m.id === r.memberId);
                    if (member) {
                        const birthYear = member.birthDate.split('-')[0];
                        facilityAgeGroups[birthYear] = (facilityAgeGroups[birthYear] || 0) + 1;
                    }
                });
                const facilityAgeStats = Object.keys(facilityAgeGroups).sort().map(year => ({
                    '출생년도': year + '년',
                    '이용 횟수': facilityAgeGroups[year]
                }));
                if (facilityAgeStats.length > 0) {
                    const wsAge = XLSX.utils.json_to_sheet(facilityAgeStats);
                    XLSX.utils.book_append_sheet(wb, wsAge, `${facility.name}-연령별`.substring(0, 31));
                }
                
                // 시설별 성별 통계
                const facilityGenderCounts = { '남': 0, '여': 0 };
                facilityReservations.forEach(r => {
                    const member = data.members.find(m => m.id === r.memberId);
                    if (member && member.gender) {
                        facilityGenderCounts[member.gender]++;
                    }
                });
                const facilityGenderStats = [
                    { '성별': '남성', '이용 횟수': facilityGenderCounts['남'] },
                    { '성별': '여성', '이용 횟수': facilityGenderCounts['여'] }
                ];
                const wsGender = XLSX.utils.json_to_sheet(facilityGenderStats);
                XLSX.utils.book_append_sheet(wb, wsGender, `${facility.name}-성별`.substring(0, 31));
                
                // 시설별 지역 통계
                const facilityRegionCounts = {};
                facilityReservations.forEach(r => {
                    const member = data.members.find(m => m.id === r.memberId);
                    if (member) {
                        const region = member.region || '기타';
                        facilityRegionCounts[region] = (facilityRegionCounts[region] || 0) + 1;
                    }
                });
                const facilityRegionStats = Object.entries(facilityRegionCounts)
                    .sort((a, b) => b[1] - a[1])
                    .map(([region, count]) => ({ '지역': region, '이용 횟수': count }));
                if (facilityRegionStats.length > 0) {
                    const wsRegion = XLSX.utils.json_to_sheet(facilityRegionStats);
                    XLSX.utils.book_append_sheet(wb, wsRegion, `${facility.name}-지역별`.substring(0, 31));
                }
            });
            
            const dateStr = new Date().toISOString().split('T')[0].replace(/-/g, '');
            const filename = `${dateStr}_${branch.name}_전체통계.xlsx`;
            
            XLSX.writeFile(wb, filename);
            showAlert('전체 통계가 다운로드되었습니다.');
        }

        function renderHistory() {
            const data = state.branchData[state.selectedBranch];

            // 오늘 날짜를 YYYY-MM-DD 형식으로 가져오기
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];

            document.getElementById('history').innerHTML = `
                <div class="panel">
                    <h3 class="panel-title">이용 기록</h3>
                    <div class="date-filter">
                        <label class="form-label" style="margin: 0;">시작일:</label>
                        <input type="date" class="form-input" id="startDate" style="width: 180px;" value="${todayStr}">
                        <label class="form-label" style="margin: 0;">종료일:</label>
                        <input type="date" class="form-input" id="endDate" style="width: 180px;" value="${todayStr}">
                        <button class="btn btn-primary" onclick="filterHistory()">조회</button>
                        <button class="btn btn-secondary" onclick="resetHistoryFilter()">전체보기</button>
                    </div>
                    <div style="overflow-x: auto;">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>회원번호</th>
                                    <th>회원명</th>
                                    <th>시설</th>
                                    <th>시작시간</th>
                                    <th>종료시간</th>
                                    <th>상태</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            // 당일 데이터로 자동 필터링
            filterHistory();
        }

        function displayHistory(filteredData = null) {
            const data = state.branchData[state.selectedBranch];
            const reservations = filteredData || data.reservations;
            const sorted = [...reservations].sort((a, b) => new Date(b.startTime) - new Date(a.startTime));
            
            const tbody = document.getElementById('historyTableBody');
            if (sorted.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #6b7280;">이용 기록이 없습니다.</td></tr>';
            } else {
                tbody.innerHTML = sorted.map(r => `
                    <tr>
                        <td>${r.memberNumber || '-'}</td>
                        <td>${r.memberName}</td>
                        <td>${r.facilityName}</td>
                        <td>${new Date(r.startTime).toLocaleString('ko-KR')}</td>
                        <td>${new Date(r.endTime).toLocaleString('ko-KR')}</td>
                        <td>
                            <span class="status-badge ${r.status === 'using' ? 'using' : r.status === 'reserved' ? 'reserved' : 'available'}">
                                ${r.status === 'using' ? '이용중' : r.status === 'reserved' ? '예약중' : r.status === 'completed' ? '완료' : '취소'}
                            </span>
                        </td>
                    </tr>
                `).join('');
            }
        }

        function filterHistory() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            if (!startDate || !endDate) {
                showAlert('시작일과 종료일을 모두 선택해주세요.', 'error');
                return;
            }
            
            const data = state.branchData[state.selectedBranch];
            const start = new Date(startDate);
            const end = new Date(endDate);
            end.setHours(23, 59, 59, 999);
            
            const filtered = data.reservations.filter(r => {
                const resDate = new Date(r.startTime);
                return resDate >= start && resDate <= end;
            });
            
            displayHistory(filtered);
            showAlert(`${filtered.length}건의 기록을 찾았습니다.`);
        }

        function resetHistoryFilter() {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            displayHistory();
        }

        function addNewFacility() {
            const name = document.getElementById('newFacilityName').value.trim();
            const type = document.getElementById('newFacilityType').value;
            const timeLimit = parseInt(document.getElementById('newFacilityTimeLimit').value);
            const capacity = parseInt(document.getElementById('newFacilityCapacity').value);
            const bgColor = document.getElementById('newFacilityBgColor').value;

            if (!name || !timeLimit || !capacity) {
                showAlert('모든 필드를 입력해주세요.', 'error');
                return;
            }

            const data = state.branchData[state.selectedBranch];
            const newId = 'FAC-' + Date.now();

            const newFacility = {
                id: newId,
                name: name,
                type: type,
                capacity: capacity,
                timeLimit: timeLimit
            };

            if (bgColor) {
                newFacility.backgroundColor = bgColor;
            }

            data.facilities.push(newFacility);

            triggerAutoSave();
            showAlert(`${name} 시설이 추가되었습니다.`);
            renderSettings();
        }

        function toggleEditFacility(facilityId) {
            const viewDiv = document.getElementById(`view-${facilityId}`);
            const editDiv = document.getElementById(`edit-${facilityId}`);
            
            if (viewDiv.classList.contains('hidden')) {
                viewDiv.classList.remove('hidden');
                editDiv.classList.add('hidden');
            } else {
                viewDiv.classList.add('hidden');
                editDiv.classList.remove('hidden');
            }
        }

        function saveFacilityEdit(facilityId) {
            const name = document.getElementById(`editName-${facilityId}`).value.trim();
            const timeLimit = parseInt(document.getElementById(`editTimeLimit-${facilityId}`).value);
            const capacity = parseInt(document.getElementById(`editCapacity-${facilityId}`).value);
            const bgColor = document.getElementById(`editBgColor-${facilityId}`).value;

            if (!name || !timeLimit || !capacity) {
                showAlert('모든 필드를 입력해주세요.', 'error');
                return;
            }

            const data = state.branchData[state.selectedBranch];
            const facilityIdx = data.facilities.findIndex(f => f.id === facilityId);

            if (facilityIdx !== -1) {
                data.facilities[facilityIdx].name = name;
                data.facilities[facilityIdx].timeLimit = timeLimit;
                data.facilities[facilityIdx].capacity = capacity;

                if (bgColor) {
                    data.facilities[facilityIdx].backgroundColor = bgColor;
                } else {
                    delete data.facilities[facilityIdx].backgroundColor;
                }

                triggerAutoSave();
                showAlert(`${name} 시설이 수정되었습니다.`);
                renderSettings();
            }
        }

        function deleteFacility(facilityId) {
            const data = state.branchData[state.selectedBranch];
            const facility = data.facilities.find(f => f.id === facilityId);

            if (!facility) return;

            // 현재 이용중이거나 예약된 상태인지 확인
            const hasActiveReservation = data.reservations.some(r =>
                r.facilityId === facilityId && (r.status === 'using' || r.status === 'reserved')
            );

            if (hasActiveReservation) {
                showAlert('현재 이용중이거나 예약된 시설은 삭제할 수 없습니다.', 'error');
                return;
            }

            if (!confirm(`'${facility.name}' 시설을 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.`)) {
                return;
            }

            const facilityIdx = data.facilities.findIndex(f => f.id === facilityId);
            if (facilityIdx !== -1) {
                data.facilities.splice(facilityIdx, 1);
                triggerAutoSave();
                showAlert(`${facility.name} 시설이 삭제되었습니다.`);
                renderSettings();
            }
        }

        window.addEventListener('DOMContentLoaded', init);
        
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.branch-selector')) {
                document.getElementById('branchDropdown').classList.remove('show');
            }
        });

        window.addEventListener('beforeunload', function() {
            saveToStorage();
        });
    </script>
</body>
</html>
